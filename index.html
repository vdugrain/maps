<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portail Cartographique</title>

<style>
:root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --background: #f4f7fb;
    --card: #ffffff;
    --text: #1e293b;
    --border: #e2e8f0;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: "Segoe UI", sans-serif;
    background: var(--background);
    color: var(--text);
    height:100vh;
    overflow:hidden;
}

/* HEADER */

.header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:72px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 30px;

    background:rgba(255,255,255,0.92);
    backdrop-filter:blur(12px);

    border-bottom:1px solid var(--border);

    z-index:1000;
}

.logo{
    font-size:1.3rem;
    font-weight:700;
    color:var(--primary);
}

.nav{
    display:flex;
    gap:12px;
}

.nav a{
    text-decoration:none;
    color:#475569;
    font-weight:600;

    padding:10px 18px;
    border-radius:12px;

    transition:all .25s ease;
}

.nav a:hover{
    background:#eef4ff;
    color:var(--primary);
}

.nav a.active{
    background:var(--primary);
    color:white;
    box-shadow:0 4px 12px rgba(37,99,235,.25);
}

/* MAIN */

.main{
    height:100vh;
    padding-top:72px;
}

.map-container{
    height:calc(100vh - 72px);
    width:100%;
    padding:20px;
}

.map-card{
    width:100%;
    height:100%;

    background:var(--card);
    border-radius:20px;
    overflow:hidden;

    box-shadow:
        0 10px 30px rgba(15,23,42,.08);

    border:1px solid var(--border);
}

/* CARTE */

.map-frame{
    width:100%;
    height:100%;
    border:none;
}

/* RESPONSIVE */

@media (max-width:768px){

    .header{
        flex-direction:column;
        justify-content:center;
        gap:10px;
        height:auto;
        padding:12px;
    }

    .nav{
        width:100%;
        justify-content:center;
        flex-wrap:wrap;
    }

    .main{
        padding-top:120px;
    }

    .map-container{
        height:calc(100vh - 120px);
        padding:10px;
    }

}
</style>

</head>
<body>

<header class="header">

    <div class="logo">
        🌍 Portail Cartographique
    </div>

    <nav class="nav">
        #Inondation</a>
        #Sécheresse</a>
        #Feux de forêt</a>
    </nav>

</header>

<main class="main">

    <div class="map-container">
        <div class="map-card">

            <!-- Remplacer src par l'URL de votre embed CARTO -->

            
            </iframe>

        </div>
    </div>

</main>

</body>
</html>
