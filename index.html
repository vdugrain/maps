<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cartographie des Risques</title>

<style>

:root{
    --primary:#0f62fe;
    --primary-hover:#0353e9;
    --background:#f5f7fa;
    --text:#1f2937;
    --border:#e5e7eb;
    --header-height:70px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Segoe UI", Arial, sans-serif;
    background:var(--background);
    color:var(--text);
    height:100vh;
    overflow:hidden;
}

/* HEADER */

header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:var(--header-height);

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 2rem;

    background:white;
    border-bottom:1px solid var(--border);

    box-shadow:0 2px 12px rgba(0,0,0,.06);

    z-index:1000;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:40px;
    height:40px;
    border-radius:10px;

    background:linear-gradient(
        135deg,
        #0f62fe,
        #42a5f5
    );
}

.title{
    font-size:1.2rem;
    font-weight:600;
}

/* NAVIGATION */

nav ul{
    display:flex;
    list-style:none;
    gap:12px;
}

nav a{
    display:block;
    text-decoration:none;

    color:#374151;
    font-weight:600;

    padding:10px 18px;
    border-radius:999px;

    transition:all .2s ease;
}

nav a:hover{
    background:#eef4ff;
    color:var(--primary);
}

nav a.active{
    background:var(--primary);
    color:white;
}

/* CONTENU */

main{
    height:100vh;
    padding-top:var(--header-height);
}

.map-wrapper{
    height:100%;
    padding:16px;
}

.map-container{
    height:100%;
    overflow:hidden;

    border-radius:20px;
    background:white;

    border:1px solid var(--border);

    box-shadow:
        0 10px 30px rgba(0,0,0,.07);
}

.map-container iframe{
    width:100%;
    height:100%;
    border:none;
}

/* RESPONSIVE */

@media (max-width:768px){

    header{
        flex-direction:column;
        height:auto;
        padding:15px;
        gap:12px;
    }

    main{
        padding-top:120px;
    }

    nav ul{
        flex-wrap:wrap;
        justify-content:center;
    }

}

</style>
</head>

        </div>
