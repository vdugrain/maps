<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carto risques</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f4f9',
                            100: '#dce5f1',
                            200: '#bdcfe3',
                            300: '#94b1d1',
                            400: '#648dbb',
                            500: '#436fa3', // Bleu acier / institutionnel
                            600: '#325586',
                            700: '#29456e',
                            800: '#253b5b',
                            900: '#22334d',
                        },
                        accent: '#0c8ce9'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }
    
        .glass-header {
            background: linear-gradient(135deg, rgba(12, 140, 233, 0.98) 0%, rgba(0, 110, 188, 1) 100%);
        }
    
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    
        .category-btn {
            white-space: nowrap;
            transition: all 0.2s ease;
        }
    
        .category-btn.active {
            background-color: #ffffff;
            color: #005898;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }
    
        .category-btn:not(.active):hover {
            background-color: rgba(255, 255, 255, 0.18);
            color: #ffffff;
        }
    </style>
</head>
<body class="h-full w-full flex flex-col overflow-hidden bg-slate-900 text-slate-800 antialiased">

    <!-- HEADER SUPÉRIEUR BANDEAU -->
    <header class="glass-header text-white relative z-30 shadow-md border-b border-white/10 flex-shrink-0">
        <!-- Bandeau principal Titre / Logo -->
        <div class="px-4 sm:px-6 lg:px-8 py-3">
            <div class="flex items-center justify-between">
                
                <!-- Logo & Titre -->
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-white/20 backdrop-blur-md flex items-center justify-center border border-white/30 shadow-inner">
                        <i class="fa-solid fa-layer-group text-accent text-xl"></i>
                    </div>
                    <div>
                        <div class="flex items-center space-x-2">
                            <h1 class="font-bold text-lg md:text-xl tracking-tight text-white leading-none">Carto risques</h1>
                            <span class="text-[10px] uppercase font-bold tracking-widest px-2 py-0.5 rounded-full bg-accent/20 text-accent border border-accent/30 hidden sm:inline-block">v0.1</span>
                        </div>
                        <p class="text-xs text-brand-100 font-light italic mt-0.5">Maquette <span class="font-medium text-white">Aldebert</span></p>
                    </div>
                </div>

                <!-- Info droite -->
                <div class="flex items-center space-x-2 text-xs text-brand-100">
                    <span class="bg-black/10 px-3 py-1.5 rounded-xl border border-white/10 hidden sm:inline-block">
                        <i class="fa-solid fa-earth-europe text-accent mr-1.5"></i>France métropolitaine
                    </span>
                </div>
            </div>
        </div>

        <!-- BANDEAU DES CATÉGORIES EN LIGNE -->
        <nav class="bg-black/20 backdrop-blur-md border-t border-white/10 px-4 py-2 overflow-x-auto no-scrollbar">
            <div class="flex items-center space-x-2 sm:space-x-3 text-xs md:text-sm text-white/90 min-w-max" id="categories-container">
                <button onclick="selectCategory(this)" class="category-btn active px-4 py-2 rounded-xl text-white/90">
                    <i class="fa-solid fa-chart-pie mr-1.5 text-accent"></i>Inondations
                </button>
                <button onclick="selectCategory(this)" class="category-btn px-4 py-2 rounded-xl text-white/90">
                    <i class="fa-solid fa-compass mr-1.5"></i>Sécheresse
                </button>
            </div>
        </nav>
    </header>

    <!-- ZONE PRINCIPALE DE LA CARTE (EMBED CARTO) -->
    <main class="relative flex-1 w-full h-full overflow-hidden bg-slate-100">
        <iframe 
            id="carto-map"
            src="https://pinea.app.carto.com/map/fd7a36be-2515-4518-8e3b-ac5960c82ade" 
            class="w-full h-full border-0" 
            title="Carte CARTO"
            allow="geolocation"
            loading="lazy">
        </iframe>
    </main>

    <script>
        function selectCategory(buttonElement) {
            // Retirer la classe active de tous les boutons
            const buttons = document.querySelectorAll('.category-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            // Activer le bouton cliqué
            buttonElement.classList.add('active');
        }
    </script>
</body>
</html>
